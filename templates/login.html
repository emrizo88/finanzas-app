<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Mis Finanzas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">

<div class="login-container">

    <div class="login-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold">💰 Mis Finanzas</h2>
            <p class="text-muted">Inicia sesión para continuar</p>
        </div>

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small">USUARIO</label>
                <input type="text" name="username" class="form-control" placeholder="Tu usuario" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small">CONTRASEÑA</label>
                <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">¿No tienes cuenta? <a href="/register">Regístrate</a></small>
        </div>
    </div>

    <div class="text-center mt-4">
        <small class="text-muted d-block">Made by Emilio Rizo</small>
        <small class="text-muted d-block">Github: emrizo88</small>
    </div>

</div>

</body>
</html>
