<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Finanzas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="d-flex">

    <!-- Sidebar -->
    <nav class="sidebar d-flex flex-column p-4">
        <h4 class="fw-bold mb-1">💰 Finanzas</h4>
        <small class="text-muted mb-4">Panel personal</small>

        <a href="{{ url_for('index') }}" class="nav-link">
            <i class="bi bi-grid-1x2"></i> Dashboard
        </a>
        <a href="{{ url_for('transacciones') }}" class="nav-link">
            <i class="bi bi-arrow-left-right"></i> Transacciones
        </a>
        <a href="{{ url_for('presupuestos_page') }}" class="nav-link">
            <i class="bi bi-pie-chart"></i> Presupuestos
        </a>
        <a href="{{ url_for('deudas') }}" class="nav-link">
            <i class="bi bi-credit-card"></i> Deudas
        </a>
        <a href="{{ url_for('inversiones') }}" class="nav-link">
            <i class="bi bi-graph-up-arrow"></i> Inversiones
        </a>
    </nav>

    <!-- Contenido principal -->
    <main class="main-content flex-grow-1 p-4">
        {% block contenido %}{% endblock %}
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
