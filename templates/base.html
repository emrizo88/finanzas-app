<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Finanzas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Navbar móvil -->
<nav class="navbar navbar-dark d-md-none px-3" style="background:#1a1a2e;">
    <span class="navbar-brand fw-bold">💰 Finanzas</span>
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">
        <span class="navbar-toggler-icon"></span>
    </button>
</nav>

<!-- Offcanvas móvil -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMobile" style="width:260px;">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title fw-bold">💰 Finanzas</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column p-3">
        <a href="{{ url_for('index') }}" class="nav-link">
            <i class="bi bi-grid-1x2"></i> Dashboard
        </a>
        <a href="{{ url_for('transacciones') }}" class="nav-link">
            <i class="bi bi-arrow-left-right"></i> Transacciones
        </a>
        <a href="{{ url_for('presupuestos_page') }}" class="nav-link">
            <i class="bi bi-pie-chart"></i> Presupuestos
        </a>
        <a href="{{ url_for('deudas') }}" class="nav-link">
            <i class="bi bi-credit-card"></i> Deudas
        </a>
        <a href="{{ url_for('inversiones') }}" class="nav-link">
            <i class="bi bi-graph-up-arrow"></i> Inversiones
        </a>

        <div class="usuario-card mt-auto mb-2">
            <div class="usuario-avatar">
                <i class="bi bi-person-fill"></i>
            </div>
            <div>
                <div class="usuario-nombre">{{ session['username'] }}</div>
                <small class="text-muted">Activo</small>
            </div>
        </div>

        <a href="{{ url_for('logout') }}" class="nav-link text-danger">
            <i class="bi bi-box-arrow-left"></i> Cerrar sesión
        </a>
    </div>
</div>

<div class="d-flex">

    <!-- Sidebar desktop — oculto en móvil -->
    <nav class="sidebar d-none d-md-flex flex-column p-4">
        <h4 class="fw-bold mb-1">💰 Finanzas</h4>
        <small class="text-muted mb-4">Panel personal</small>

        <a href="{{ url_for('index') }}" class="nav-link">
            <i class="bi bi-grid-1x2"></i> Dashboard
        </a>
        <a href="{{ url_for('transacciones') }}" class="nav-link">
            <i class="bi bi-arrow-left-right"></i> Transacciones
        </a>
        <a href="{{ url_for('presupuestos_page') }}" class="nav-link">
            <i class="bi bi-pie-chart"></i> Presupuestos
        </a>
        <a href="{{ url_for('deudas') }}" class="nav-link">
            <i class="bi bi-credit-card"></i> Deudas
        </a>
        <a href="{{ url_for('inversiones') }}" class="nav-link">
            <i class="bi bi-graph-up-arrow"></i> Inversiones
        </a>

        <div class="usuario-card mt-auto mb-2">
            <div class="usuario-avatar">
                <i class="bi bi-person-fill"></i>
            </div>
            <div>
                <div class="usuario-nombre">{{ session['username'] }}</div>
                <small class="text-muted">Activo</small>
            </div>
        </div>

        <a href="{{ url_for('logout') }}" class="nav-link text-danger">
            <i class="bi bi-box-arrow-left"></i> Cerrar sesión
        </a>
    </nav>

    <!-- Contenido principal -->
    <main class="main-content flex-grow-1 p-3 p-md-4">
        {% block contenido %}{% endblock %}
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
